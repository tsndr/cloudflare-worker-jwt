name: Publish
run-name: Publish ${{ github.ref_name }}

on:
  release:
    types: [ published ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: |
          npm pack --silent > /dev/null
          tar tzf ./*.tgz | sed 's|^package/||' | sort > packed.txt
          cat packed.txt
          for file in index.js index.d.ts; do
            if ! grep -qxF "$file" packed.txt; then
              echo "::error::$file is missing from the package tarball"
              exit 1
            fi
          done
          rm -f packed.txt ./*.tgz

      - name: Publish to npmjs
        id: npmjs
        run: npm publish --tag ${{ contains(github.ref_name, '-') && 'pre' || 'latest' }} --provenance --access public
        continue-on-error: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com/

      - name: Publish to GPR
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --tag ${{ contains(github.ref_name, '-') && 'pre' || 'latest' }} --access public

      - name: Fail if publishing to npmjs failed
        if: always() && steps.npmjs.outcome == 'failure'
        run: |
          echo "::error::Publishing to npmjs failed"
          exit 1
